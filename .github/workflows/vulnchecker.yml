name: VulnChecker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  vulnchecker:
    uses: ./.github/workflows/vulnchecker-reusable.yml
    with:
      scan-path: .
      fail-on: high
      output-format: sarif
      upload-sarif: true
