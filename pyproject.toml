[project]
name = "vulnchecker"
version = "0.1.0"
description = "Vulnerability dependency checker for npm packages using the OSV API"
readme = "prompt.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Josh Ivan Sartin" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
keywords = ["security", "vulnerability", "npm", "dependencies", "osv", "audit"]
dependencies = [
    "httpx>=0.27.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.0.0",
    "google-auth>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/bamwinbam-cloud/vulnchecker"
Repository = "https://github.com/bamwinbam-cloud/vulnchecker"

[project.scripts]
vulnchecker = "vulnchecker.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["vulnchecker/tests"]

[tool.setuptools.packages.find]
include = ["vulnchecker*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
